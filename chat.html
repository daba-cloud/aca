<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — Chat</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <div class="zaglavlje">
        <a href="index.html" class="nazad">←</a>
        <h1>Chat</h1>
    </div>

    <div id="poruke"></div>

    <div class="unos">
        <input type="text" id="ime" placeholder="Ime..." maxlength="15" autocomplete="off">
        <input type="text" id="tekst-poruke" placeholder="Napiši poruku..." maxlength="200" autocomplete="off">
        <button id="posalji">Pošalji</button>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        // DODATO: 'remove' za brisanje poruka
        import { getDatabase, ref, push, onValue, serverTimestamp, remove } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        const firebaseConfig = {
            databaseURL: "https://aleksandar-d48ba-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const porukeRef = ref(db, 'soba-aleksandar');

        const dugme = document.getElementById('posalji');
        const inputIme = document.getElementById('ime');
        const inputPoruka = document.getElementById('tekst-poruke');
        const kontejnerPoruka = document.getElementById('poruke');

        // Pamćenje imena
        const sacuvanoIme = localStorage.getItem('mojeIme');
        if (sacuvanoIme) {
            inputIme.value = sacuvanoIme;
        }

        inputIme.addEventListener('input', () => {
            localStorage.setItem('mojeIme', inputIme.value.trim());
        });

        // Slanje poruke
        dugme.addEventListener('click', () => {
            const ime = inputIme.value.trim();
            const tekst = inputPoruka.value.trim();
            
            if (ime === "") {
                alert("Molim te prvo upiši svoje ime!");
                inputIme.focus();
                return;
            }

            if (tekst === "") return;

            push(porukeRef, {
                ime: ime,
                tekst: tekst,
                vreme: serverTimestamp()
            });

            inputPoruka.value = ""; 
        });

        inputPoruka.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') dugme.click();
        });

        // Primanje poruka
        onValue(porukeRef, (snapshot) => {
            kontejnerPoruka.innerHTML = ""; 

            snapshot.forEach((childSnapshot) => {
                const podaci = childSnapshot.val();
                const kljucPoruke = childSnapshot.key; // Uzimamo ID poruke iz baze
                
                const div = document.createElement('div');
                div.className = 'poruka druga'; 
                
                // Dodajemo data-id atribut da znamo koju poruku brišemo
                div.setAttribute('data-id', kljucPoruke);

                div.innerHTML = `<span class="ime-posiljaoca">${podaci.ime}</span>${podaci.tekst}`;
                kontejnerPoruka.appendChild(div);
            });

            kontejnerPoruka.scrollTop = kontejnerPoruka.scrollHeight;
        });

        // FUNKCIJA ZA BRISANJE PORUKE (Klikom na poruku)
        kontejnerPoruka.addEventListener('click', (e) => {
            // Nalazimo roditeljski element (div poruke) na koji je kliknuto
            const porukaDiv = e.target.closest('.poruka');
            
            if (porukaDiv) {
                const idPoruke = porukaDiv.getAttribute('data-id');
                
                if (idPoruke) {
                    // Pitamo korisnika za potvrdu pre brisanja
                    if (confirm("Da li želiš da obrišeš ovu poruku?")) {
                        const porukaRef = ref(db, `soba-aleksandar/${idPoruke}`);
                        
                        remove(porukaRef)
                            .then(() => {
                                console.log("Poruka uspešno obrisana.");
                            })
                            .catch((error) => {
                                console.error("Greška pri brisanju: ", error);
                                alert("Došlo je do greške prilikom brisanja.");
                            });
                    }
                }
            }
        });
    </script>

</body>
</html>
