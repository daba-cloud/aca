<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — Chat</title>
    
    <!-- Fontovi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Povezivanje sa novim CSS fajlom -->
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <div class="zaglavlje">
        <a href="index.html" class="nazad">←</a>
        <h1>Chat</h1>
    </div>

    <div id="poruke"></div>

    <div class="unos">
        <input type="text" id="ime" placeholder="Ime..." maxlength="15">
        <input type="text" id="tekst-poruke" placeholder="Napiši poruku..." maxlength="200">
        <button id="posalji">Pošalji</button>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, push, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        // OVDE JE TVOJ URL
        const firebaseConfig = {
            databaseURL: "https://aleksandar-d48ba-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const porukeRef = ref(db, 'soba-aleksandar');

        const dugme = document.getElementById('posalji');
        const inputIme = document.getElementById('ime');
        const inputPoruka = document.getElementById('tekst-poruke');
        const kontejnerPoruka = document.getElementById('poruke');

        dugme.addEventListener('click', () => {
            const ime = inputIme.value.trim() || "Anonim";
            const tekst = inputPoruka.value.trim();
            
            if (tekst === "") return;

            push(porukeRef, {
                ime: ime,
                tekst: tekst,
                vreme: serverTimestamp()
            });

            inputPoruka.value = ""; 
        });

        inputPoruka.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') dugme.click();
        });

        onValue(porukeRef, (snapshot) => {
            kontejnerPoruka.innerHTML = ""; 
            const mojeIme = inputIme.value.trim() || "Anonim";

            snapshot.forEach((childSnapshot) => {
                const podaci = childSnapshot.val();
                const div = document.createElement('div');
                div.className = 'poruka';
                
                if (podaci.ime === mojeIme) {
                    div.classList.add('moja');
                } else {
                    div.classList.add('druga');
                }

                div.innerHTML = `<span class="ime-posiljaoca">${podaci.ime}</span>${podaci.tekst}`;
                kontejnerPoruka.appendChild(div);
            });

            kontejnerPoruka.scrollTop = kontejnerPoruka.scrollHeight;
        });
    </script>

</body>
</html>
