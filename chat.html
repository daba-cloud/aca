<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — Chat</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #e8e8e8;
            font-family: 'EB Garamond', serif;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Sprečava skrolovanje cele stranice */
        }

        /* Zaglavlje */
        .zaglavlje {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #000000;
            position: relative;
            flex-shrink: 0;
        }
        .zaglavlje h1 {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #e8e8e8;
        }
        .nazad {
            position: absolute;
            left: 15px;
            top: 18px;
            color: #666;
            text-decoration: none;
            font-size: 20px;
        }

        /* Prostor za poruke (skroluje se samo ovaj deo) */
        #poruke {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .poruka {
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .poruka.moja {
            align-self: flex-end;
            background-color: #1a1a1a;
            border: 1px solid #333;
        }
        .poruka.druga {
            align-self: flex-start;
            background-color: transparent;
            border: 1px solid #444;
        }
        .ime-posiljaoca {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            display: block;
        }

        /* Unos poruke (uvek na dnu) */
        .unos {
            display: flex;
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #000000;
            gap: 8px;
            flex-shrink: 0;
        }

        #ime {
            width: 70px; /* Fiksna širina za ime */
            background: transparent;
            border: 1px solid #333;
            color: #e8e8e8;
            padding: 8px;
            font-family: 'EB Garamond', serif;
            font-size: 14px;
            outline: none;
            border-radius: 4px;
        }

        #tekst-poruke {
            flex: 1; /* Zauzima ostatak prostora */
            background: transparent;
            border: 1px solid #333;
            color: #e8e8e8;
            padding: 8px;
            font-family: 'EB Garamond', serif;
            font-size: 15px;
            outline: none;
            border-radius: 4px;
        }

        #posalji {
            background-color: transparent;
            color: #e8e8e8;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0 15px;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }
        #posalji:active {
            background-color: #e8e8e8;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="zaglavlje">
        <a href="index.html" class="nazad">←</a>
        <h1>Chat</h1>
    </div>

    <div id="poruke"></div>

    <div class="unos">
        <input type="text" id="ime" placeholder="Ime" maxlength="15" value="Gost">
        <input type="text" id="tekst-poruke" placeholder="Napiši poruku..." maxlength="200">
        <button id="posalji">➤</button>
    </div>

    <!-- FIREBASE SKRIPTA -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, push, onValue } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        // ⚠️ OVDE OBAVEZNO ZALEPI SVOJ URL IZ FIREBASE-A! ⚠️
        const firebaseConfig = {
            databaseURL: "const firebaseConfig = {
    databaseURL: "https://aleksandar-d48ba-default-rtdb.firebaseio.com"
};" // <--- ZALEPI URL IZMEĐU NAVODNIKA
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const porukeRef = ref(db, 'soba-aleksandar');

        const dugme = document.getElementById('posalji');
        const inputIme = document.getElementById('ime');
        const inputPoruka = document.getElementById('tekst-poruke');
        const kontejnerPoruka = document.getElementById('poruke');

        dugme.addEventListener('click', () => {
            const ime = inputIme.value.trim() || "Gost";
            const tekst = inputPoruka.value.trim();
            
            if (tekst === "") return;

            push(porukeRef, {
                ime: ime,
                tekst: tekst
            });

            inputPoruka.value = "";
        });

        inputPoruka.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') dugme.click();
        });

        onValue(porukeRef, (snapshot) => {
            kontejnerPoruka.innerHTML = "";
            const mojeIme = inputIme.value.trim() || "Gost";

            snapshot.forEach((childSnapshot) => {
                const podaci = childSnapshot.val();
                const div = document.createElement('div');
                div.className = 'poruka';
                
                if (podaci.ime === mojeIme) {
                    div.classList.add('moja');
                } else {
                    div.classList.add('druga');
                }

                div.innerHTML = `<span class="ime-posiljaoca">${podaci.ime}</span>${podaci.tekst}`;
                kontejnerPoruka.appendChild(div);
            });

            kontejnerPoruka.scrollTop = kontejnerPoruka.scrollHeight;
        });
    </script>

</body>
</html>
