<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            overflow: hidden;
        }

        .stranica {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* SADA JE NA VRHU, A NE U CENTRU */
            justify-content: flex-start; 
            padding-top: 60px; /* Razmak od gornje ivice ekrana */
            height: 100%;
            width: 100%;
            text-align: center;
        }

        /* NASLOV */
        .ime-monaha {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: 12px; /* Veći razmak za luksuzan izgled */
            color: #ffffff;
            margin-bottom: 25px; /* Razmak do menija */
        }

        /* KONTEJNER ZA NAVIGACIJU (Horizontalni meni) */
        .dugmad-kontejner {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px; /* Razmak između reči */
            width: 100%;
            padding: 0 20px;
        }

        /* STIL DUGMADI (Čiste reči) */
        .dugme-monah {
            display: inline-block;
            color: #888888;
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 3px;
            transition: color 0.3s ease;
            background-color: transparent;
            border: none;
            padding: 5px 0;
            position: relative;
        }

        .dugme-monah:hover, .dugme-monah:active {
            color: #ffffff;
        }

        /* Bela linija ispod reči na hover */
        .dugme-monah::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1.5px; /* Malo tanja linija za eleganciju */
            bottom: -3px;
            left: 0;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .dugme-monah:hover::after {
            width: 100%;
        }

    </style>
</head>
<body>

    <div class="stranica">
        <!-- Naslov na vrhu -->
        <h1 class="ime-monaha">Aleksandar</h1>
        
        <!-- Meni odmah ispod naslova -->
        <div class="dugmad-kontejner">
            <a href="ulaz.html" class="dugme-monah">Portal</a>
            <a href="video.html" class="dugme-monah">YouTube</a>
            <a href="player.html" class="dugme-monah">Video</a>
            <a href="#" class="dugme-monah">Blog</a>
            <a href="#" class="dugme-monah">News</a>
            <a href="tekst.html" class="dugme-monah">Notes</a>
            <a href="audio.html" class="dugme-monah">Audio</a>
        </div>
    </div>

</body>
</html>
