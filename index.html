<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .stranica {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* NASLOV (Gore, centriran) */
        .ime-monaha {
            font-size: 56px; /* Veliki naslov kao CHANEL */
            font-weight: 600;
            letter-spacing: 10px;
            color: #ffffff;
            margin-bottom: 40px; /* Razmak do menija */
        }

        /* KONTEJNER ZA NAVIGACIJU (Horizontalni meni) */
        .dugmad-kontejner {
            display: flex;
            flex-direction: row; /* Ovo sada radi ispravno - redja u jedan red */
            flex-wrap: wrap; /* Ako je ekran manji, prelazi u novi red */
            justify-content: center;
            gap: 40px; /* Veći razmak između reči, kao na Chanel-u */
            width: 100%;
            max-width: 1100px;
        }

        /* STIL DUGMADI (Čiste reči) */
        .dugme-monah {
            display: inline-block;
            color: #888888; /* Siva boja */
            text-decoration: none;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 3px; /* Razmak između slova u reči */
            transition: color 0.3s ease;
            background-color: transparent;
            border: none;
            padding: 5px 0;
            position: relative; /* Za liniju ispod */
        }

        /* Efekat na hover */
        .dugme-monah:hover, .dugme-monah:active {
            color: #ffffff;
        }

        /* Bela linija ispod reči na hover */
        .dugme-monah::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .dugme-monah:hover::after {
            width: 100%;
        }

    </style>
</head>
<body>

    <div class="stranica">
        <h1 class="ime-monaha">Aleksandar</h1>
        
        <!-- Horizontalni meni -->
        <div class="dugmad-kontejner">
            <a href="ulaz.html" class="dugme-monah">Portal</a>
            <a href="video.html" class="dugme-monah">YouTube</a>
            <a href="player.html" class="dugme-monah">Video</a>
            <a href="#" class="dugme-monah">Blog</a>
            <a href="#" class="dugme-monah">News</a>
            <a href="tekst.html" class="dugme-monah">Notes</a>
            <a href="audio.html" class="dugme-monah">Audio</a>
        </div>
    </div>

</body>
</html>
