<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar</title>
    
    <!-- Učitavanje Barlow Condensed fonta -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000; /* Crna pozadina */
            height: 100%;
            width: 100%;
            color: #ffffff; /* Bela slova */
            font-family: 'Barlow Condensed', sans-serif; /* Novi font za sve */
            text-transform: uppercase; /* SVE VELIKIM SLOVIMA */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .stranica {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* NASLOV - Umesto CHANEL piše ALEKSANDAR */
        .ime-monaha {
            font-size: 52px; /* Veliki naslov */
            font-weight: 600; /* Bold */
            letter-spacing: 8px; /* Razmak između slova kao na Chanel-u */
            color: #ffffff;
            margin-bottom: 50px; /* Razmak do menija */
        }

        /* KONTEJNER ZA NAVIGACIJU */
        .dugmad-kontejner {
            display: flex;
            flex-direction: column;
            gap: 18px; /* Razmak između reči */
            align-items: center;
        }

        /* STIL DUGMADI - Sada su to samo čiste reči */
        .dugme-monah {
            display: inline-block;
            color: #888888; /* Siva boja dok nije aktivno */
            text-decoration: none;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 5px; /* Veći razmak za elegantniji izgled */
            transition: color 0.3s ease, transform 0.3s ease;
            background-color: transparent;
            border: none; /* NEMA OKVIRA */
            padding: 5px 10px;
        }

        /* Efekat kada pređeš mišem preko reči */
        .dugme-monah:hover, .dugme-monah:active {
            color: #ffffff; /* Postaje belo */
            transform: scale(1.05); /* Blago uvećanje */
        }
    </style>
</head>
<body>

    <div class="stranica">
        <!-- Glavni naslov -->
        <h1 class="ime-monaha">Aleksandar</h1>
        
        <!-- Navigacija (Reči umesto dugmadi) -->
        <div class="dugmad-kontejner">
            <a href="ulaz.html" class="dugme-monah">Portal</a>
            <a href="video.html" class="dugme-monah">YouTube</a>
            <a href="player.html" class="dugme-monah">Video</a>
            <a href="#" class="dugme-monah">Blog</a>
            <a href="#" class="dugme-monah">News</a>
            <a href="tekst.html" class="dugme-monah">Notes</a>
            <a href="audio.html" class="dugme-monah">Audio</a>
        </div>
    </div>

</body>
</html>
