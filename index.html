<!DOCTYPE html>
<html lang="la">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* ===== OSNOVNI STILOVI ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'EB Garamond', serif;
            overflow: hidden;
        }

        /* ===== GLAVNI KONTEJNER ===== */
        .stranica {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* ===== NASLOV ===== */
        .ime-monaha {
            font-family: 'Cinzel', serif;
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 6px;
            color: #e8e8e8;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        /* ===== PODNASLOV ===== */
        .podnaslov {
            font-family: 'EB Garamond', serif;
            font-size: 16px;
            font-style: italic;
            letter-spacing: 2px;
            color: #888888;
            margin-bottom: 50px;
        }

        /* ===== KONTEJNER ZA DUGMAD ===== */
        .dugmad-kontejner {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Razmak između PORTAL i CHAT dugmeta */
            align-items: center;
        }

        /* ===== STIL DUGMADI (Zajednički za PORTAL i CHAT) ===== */
        .dugme-monah {
            display: inline-block;
            color: #e8e8e8;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 4px;
            padding: 15px 45px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            transition: all 0.5s ease;
            text-transform: uppercase;
            background-color: transparent;
            min-width: 200px; /* Da oba dugmeta budu iste širine */
        }

        .dugme-monah:active,
        .dugme-monah:hover {
            background-color: #e8e8e8;
            color: #000000;
            border-color: #e8e8e8;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="stranica">
        <!-- Ime monaha -->
        <h1 class="ime-monaha">Aleksandar</h1>
        
        <!-- Latinski podnaslov -->
        <p class="podnaslov">Acta · Non Verba</p>
        
        <!-- DUGMAD -->
        <div class="dugmad-kontejner">
            <!-- Dugme Portal -->
            <a href="ulaz.html" class="dugme-monah">Portal</a>
            
            <!-- NOVO: Dugme Chat -->
            <!-- Napravićemo da vodi na stranicu chat.html koju ćemo kasnije napraviti -->
            <a href="chat.html" class="dugme-monah">Chat</a>
        </div>
    </div>

</body>
</html>
