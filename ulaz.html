<!DOCTYPE html>
<html lang="la">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — Ulaz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'EB Garamond', serif;
            overflow: hidden;
        }

        .stranica {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* Naslov na vrhu */
        .naslov {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 5px;
            color: #e8e8e8;
            text-transform: uppercase;
            margin-bottom: 50px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Kontejner za dugmiće */
        .meni-dugmad {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Razmak između dugmića */
            width: 100%;
            max-width: 280px; /* Maksimalna širina da ne budu predugački */
        }

        /* Stil dugmića */
        .dugme {
            display: inline-block;
            color: #e8e8e8;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 3px;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            transition: all 0.4s ease;
            text-transform: uppercase;
            background-color: transparent;
            text-align: center;
        }

        .dugme:active,
        .dugme:hover {
            background-color: #e8e8e8;
            color: #000000;
            border-color: #e8e8e8;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        /* Diskretno dugme za povratak nazad */
        .nazad {
            margin-top: 40px;
            color: #666666;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        
        .nazad:hover, .nazad:active {
            color: #e8e8e8;
        }
    </style>
</head>
<body>

    <div class="stranica">
        <!-- Naslov -->
        <h1 class="naslov">Odaberi</h1>
        
        <!-- 5 Dugmića koja vode dalje -->
        <div class="meni-dugmad">
            <!-- Ovde menjaj tekst i linkove (href) za svako dugme -->
            <a href="#" class="dugme">prazno</a>
            <a href="#" class="dugme">prazno</a>
            <a href="#" class="dugme">prazno</a>
            <a href="#" class="dugme">prazno</a>
            <a href="#" class="dugme">Kontakt</a>
        </div>

        <!-- Dugme da se vratiš na početnu stranicu -->
        <a href="index.html" class="nazad">← Nazad na početak</a>
    </div>

</body>
</html>
